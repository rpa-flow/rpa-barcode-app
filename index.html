<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Leitor de Código de Barras</title>
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section id="scannerTab" class="app-tab-content">
        <section class="panel">
          <button id="installBtn" hidden>Instalar aplicativo</button>
        </section>

        <video id="preview" autoplay playsinline muted></video>

        <section class="panel action-panel">
          <button id="startBtn">Ler barcode</button>
          <button id="stopBtn" disabled>Parar câmera</button>
          <p id="readStatus" class="read-status">Nenhuma leitura realizada.</p>
        </section>

        <section class="panel form-panel">
          <div class="form-field">
            <label for="nomeMotoristaInput">Nome motorista</label>
            <input id="nomeMotoristaInput" type="text" placeholder="Ex.: João da Silva" />
          </div>

          <div class="form-field">
            <label for="telefoneInput">Telefone</label>
            <input id="telefoneInput" type="tel" placeholder="Ex.: (11) 99999-9999" />
          </div>

          <div class="form-field">
            <label for="placaInput">Placa</label>
            <input id="placaInput" type="text" placeholder="Ex.: ABC1D23" />
          </div>

          <div class="form-field">
            <label for="cnpjInput">CNPJ do emitente (extraído da chave)</label>
            <input id="cnpjInput" type="text" placeholder="Lido automaticamente" readonly />
          </div>

          <div class="form-field">
            <label for="numeroNotaInput">Número da nota (extraído da chave)</label>
            <input id="numeroNotaInput" type="text" placeholder="Lido automaticamente" readonly />
          </div>

          <div class="form-field">
            <label for="fornecedorInput">Fornecedor</label>
            <select id="fornecedorInput"></select>
          </div>

          <div class="form-field">
            <label for="colaboradorRecebimentoSelect">Nome do colaborador que recebeu</label>
            <select id="colaboradorRecebimentoSelect"></select>
          </div>

          <div class="form-field">
            <label for="pesoInput">Peso</label>
            <input id="pesoInput" type="number" inputmode="decimal" min="0" step="0.001" placeholder="Ex.: 12500" />
          </div>

          <div class="form-field">
            <label for="patioDescargaSelect">Pátio de descarga</label>
            <select id="patioDescargaSelect"></select>
          </div>

          <div class="form-field">
            <label for="dataRecebimentoInput">Data de recebimento</label>
            <input id="dataRecebimentoInput" type="date" />
          </div>
        </section>

        <section class="panel result">
          <strong>Último código lido:</strong>
          <span id="lastCode">Nenhum</span>
        </section>

        <section class="panel">
          <button id="sendBtn" disabled>
            <span class="btn-text">Enviar dados</span>
            <span class="btn-loader" hidden aria-hidden="true"></span>
          </button>
        </section>

        <section id="offlineWarning" class="panel offline-warning" hidden>
          <strong>Atenção</strong>
          <p>
            Existem muitas notas pendentes. Vá até um local com internet para reenviar.
            Em caso de dúvida, procure o suporte.
          </p>
        </section>
      </section>

      <section id="historyTab" class="app-tab-content" hidden>
        <section class="panel history-panel">
          <strong>Histórico de envios</strong>
          <p class="history-hint">Visualize os últimos 10 envios e reenvie os que falharam.</p>
          <div id="historyList" class="history-list"></div>
        </section>
      </section>

      <section id="feedbackBanner" class="feedback-banner" hidden role="status" aria-live="polite"></section>

      <section class="panel status">
        <strong>Status</strong>
        <p id="statusOutput">Aguardando leitura do código.</p>
      </section>

      <nav class="tab-menu" aria-label="Menu principal">
        <button id="scannerTabBtn" class="tab-btn active" type="button">Leitura</button>
        <button id="historyTabBtn" class="tab-btn" type="button">Histórico</button>
      </nav>
    </main>

    <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
