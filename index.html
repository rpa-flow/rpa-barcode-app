<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPA Barcode App</title>
  </head>
  <body>
    <main>
      <h1>Dados da Entrega</h1>
      <form>
        <label for="barcode">Código de barras</label>
        <input id="barcode" name="barcode" type="text" />

        <label for="driverName">Nome do motorista</label>
        <input id="driverName" name="driverName" type="text" />

        <label for="phone">Telefone</label>
        <input id="phone" name="phone" type="tel" />

        <label for="plate">Placa</label>
        <input id="plate" name="plate" type="text" />
      </form>
    </main>
  </body>
</html>
