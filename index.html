<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leitor de Código de Barras</title>
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Leitor de Código de Barras</h1>
      <p class="hint">Abra em HTTPS para usar câmera e instalar no celular.</p>

      <section class="panel">
        <button id="installBtn" hidden>Instalar aplicativo</button>
      </section>

      <video id="preview" autoplay playsinline muted></video>

      <section class="panel">
        <button id="startBtn">Iniciar câmera</button>
        <button id="stopBtn" disabled>Parar câmera</button>
      </section>

      <section class="panel">
        <label for="nomeMotoristaInput">Nome motorista</label>
        <input id="nomeMotoristaInput" type="text" placeholder="Ex.: João da Silva" />

        <label for="telefoneInput">Telefone</label>
        <input id="telefoneInput" type="tel" placeholder="Ex.: (11) 99999-9999" />

        <label for="placaInput">Placa</label>
        <input id="placaInput" type="text" placeholder="Ex.: ABC1D23" />
      </section>

      <section class="panel result">
        <strong>Último código lido:</strong>
        <span id="lastCode">Nenhum</span>
      </section>

      <section class="panel">
        <button id="sendBtn" disabled>Enviar dados</button>
      </section>


      <section id="offlineWarning" class="panel offline-warning" hidden>
        <strong>Atenção</strong>
        <p>
          Existem muitas notas pendentes. Vá até um local com internet para reenviar.
          Em caso de dúvida, procure o suporte.
        </p>
      </section>
      <section class="panel status">
        <strong>Status</strong>
        <p id="statusOutput">Aguardando leitura do código.</p>
      </section>
    </main>

    <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
